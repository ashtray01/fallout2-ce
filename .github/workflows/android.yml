name: Android fork

on:
  push:
    branches: [main, android-fixes]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PROPERTIES_FILE_BASE64 }}
        run: |
          test -n "$KEYSTORE" && test -n "$PROPERTIES"
          printf '%s' "$KEYSTORE" | base64 --decode > os/android/release.keystore
          printf '%s' "$PROPERTIES" | base64 --decode > os/android/release-keystore.properties
      - name: Test stylus gesture ordering
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/stylus_test.cc -o /tmp/stylus-test
          /tmp/stylus-test
      - name: Test, lint and build
        working-directory: os/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Build pull request APK
        if: github.event_name == 'pull_request'
        working-directory: os/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Build signed release
        if: github.event_name != 'pull_request'
        working-directory: os/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify signed APK and 16 KB packaging
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose os/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 os/android/app/build/outputs/apk/release/app-release.apk
          python3 tools/check_android_apk.py os/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            os/android/app/build/reports/tests/
            os/android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: fallout2-ce-android-release
          path: os/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f os/android/release.keystore os/android/release-keystore.properties

  publish:
    name: Publish Android release
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fallout2-ce-android-release
          path: dist
      - name: Create GitHub release with the verified APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: Fallout 2 CE — Android Stylus Controls
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          short="${version%%-*}"
          apk="fallout2-ce-android-${short}.apk"
          mv dist/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          notes="docs/release-notes/${version}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes" \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --verify-tag
          fi
          gh release view "$GITHUB_REF_NAME" --json url,assets
